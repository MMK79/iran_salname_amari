[project]
name = "iran-education-stats"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.5",
    "html5lib>=1.1",
    "lxml>=6.1.3",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-docx>=1.2.0",
]

[dependency-groups]
dashboard = [
    "plotly>=7.1.0",
    "streamlit>=1.64.0",
]
analysis = [
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.5",
    "pyreadr>=0.5.7",
    "statsmodels>=0.14.5",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".cache", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905"]
